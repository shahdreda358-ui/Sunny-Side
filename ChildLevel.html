<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Style/bootstrap.min.css">
    <link rel="stylesheet" href="./Style/style.css">
</head>

<body>
    <div class="vh-50 Card-ID w-75 d-flex align-items-center gap-5">
        <img src="./Images/Child-1.jpg" class="card-img-top h-25 w-25 rounded-pill" alt="...">
        <div class="card-body">
            <h3 class="fw-bolder fs-3">Name:
            </h3>
            <br>
            <h3 class="fw-bolder fs-3">ID:
            </h3>
            <br>
            <h3 class="fw-bolder fs-3">Age:
            </h3>
            <br>
            <h3 class="fw-bolder fs-3">Class:
            </h3>

        </div>

    </div>
    <div class="container py-5">

        <h3 class="fw-bold mb-4">
            Child Development
        </h3>
  

        <label class="mb-2">Creativity</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 85%">85%</div>
        </div>

        <label class="mb-2">Communication</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-info" style="width: 75%">75%</div>
        </div>

        <label class="mb-2">Problem Solving</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 70%">70%</div>
        </div>

        <label class="mb-2">Reading Skills</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 80%">80%</div>
        </div>

        <label class="mb-2">Listening Skills</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 65%">65%</div>
        </div>

        <label class="mb-2">Critical Thinking</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-secondary" style="width: 60%">60%</div>
        </div>
    </div>
    <script src="./Scripts/bootstrap.bundle.min.js"></script>
    <script src="./Scripts/main.js"></script>
</body>

</html>
